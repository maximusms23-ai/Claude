# MAXIMUS_T2_INSTALLER_V4 - GRUB-Einstellungen fuer T2-Macs
#
# Diese Werte setzt scripts/install.sh in /etc/default/grub.
# Jede Zeile hat die Form SCHLUESSEL=WERT.
# GRUB ist der Bootloader. Er startet das Betriebssystem.

# Das Menue bleibt sichtbar. So ist ein Rueckfall jederzeit moeglich.
GRUB_TIMEOUT=10
GRUB_TIMEOUT_STYLE=menu

# Der zuletzt gewaehlte Eintrag wird NICHT dauerhaft gespeichert.
# Ein Teststart bleibt damit einmalig.
GRUB_DEFAULT=saved
GRUB_SAVEDEFAULT=false

# Aeltere Kernel bleiben im Untermenue sichtbar.
GRUB_DISABLE_SUBMENU=false

# Der Wiederherstellungsmodus bleibt verfuegbar.
GRUB_DISABLE_RECOVERY=false
