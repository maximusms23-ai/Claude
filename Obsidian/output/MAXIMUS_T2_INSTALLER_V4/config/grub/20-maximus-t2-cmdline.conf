# MAXIMUS_T2_INSTALLER_V4 - Kernelparameter fuer T2-Macs
#
# Diese Parameter ergaenzt scripts/install.sh in GRUB_CMDLINE_LINUX.
# Sie gelten fuer alle Menueeintraege, auch fuer die Rueckfallkernel.
# Auf dem Ubuntu-Kernel sind sie wirkungslos oder unschaedlich.
#
# intel_iommu=on  Schaltet die Eingabe-Ausgabe-Speicherverwaltung ein.
# iommu=pt        Setzt den Durchleitungsmodus. Der T2-Chip benoetigt ihn.
# pm_async=off    Schaltet das parallele Anhalten von Geraeten ab.
#                 Ohne diesen Wert bleibt der Audio- und Eingabepfad haengen.
# pcie_ports=native  Gibt dem Kernel die Kontrolle ueber die PCIe-Anschluesse.
#                 Thunderbolt und USB-C benoetigen diesen Wert.

intel_iommu=on
iommu=pt
pm_async=off
pcie_ports=native
