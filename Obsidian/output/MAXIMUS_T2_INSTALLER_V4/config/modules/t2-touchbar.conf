# MAXIMUS_T2_INSTALLER_V4 -> Ziel: /etc/modprobe.d/t2-touchbar.conf
# Legt die Standardanzeige der Touch Bar fest.
#   mode=0  Escape-Taste,   Fn: ohne Funktion
#   mode=1  Funktionstasten, Fn: Medien- und Helligkeitstasten
#   mode=2  Medientasten,    Fn: Funktionstasten
options hid-appletb-kbd mode=1
