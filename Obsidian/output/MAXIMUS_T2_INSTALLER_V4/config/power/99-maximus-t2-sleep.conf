# MAXIMUS_T2_INSTALLER_V4 -> Ziel: /etc/systemd/logind.conf.d/99-maximus-t2-sleep.conf
#
# Ergebnis: Das Geraet geht nicht von selbst in den Ruhezustand.
#
# Begruendung: Der Ruhezustand ist auf dem MacBookPro16,1 nachweislich
# fehlerhaft. Dokumentierte Folgen sind ein haengender Startvorgang,
# ein Verlust des internen USB-Busses und Abstuerze der Radeon-Grafik.
# Ein haengender Ruhezustand bei voller Luefterlast ist zudem ein
# Temperaturrisiko.
#
# Diese Datei entfernt scripts/rollback.sh wieder.
# Nach einer erfolgreichen Standby-Pruefung kannst du sie loeschen.

[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
IdleAction=ignore
