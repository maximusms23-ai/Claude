
search --set=root --file /ubuntu

insmod all_video

# NUR FUER DEN PRUEFLAUF. Dieses Menue gehoert nicht auf das Auslieferungs-ISO.
set default="0"
set timeout=10

menuentry "Try or Install Ubuntu" {
   linux /casper/vmlinuz file=/cdrom/preseed/mbp.seed boot=casper ro quiet splash pm_async=off intel_iommu=on iommu=pt ---
   initrd /casper/initrd
}
menuentry "PRUEFLAUF: Neuinstallation auf die Testplatte" {
   linux /casper/vmlinuz file=/cdrom/preseed/maximus-de.seed boot=casper ro maximus.install=1 maximus.test=1 systemd.unit=multi-user.target console=tty0 console=ttyS0,115200 pm_async=off intel_iommu=on iommu=pt ---
   initrd /casper/initrd
}
menuentry "MAXIMUS Selbsttest" {
   linux /casper/vmlinuz file=/cdrom/preseed/maximus-selbsttest.seed boot=casper ro maximus.selftest=1 systemd.unit=multi-user.target console=tty0 console=ttyS0,115200 pm_async=off intel_iommu=on iommu=pt ---
   initrd /casper/initrd
}
