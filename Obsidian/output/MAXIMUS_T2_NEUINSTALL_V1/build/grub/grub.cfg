
search --set=root --file /ubuntu

insmod all_video

# Der Vorgabeeintrag ist das Live-System, NICHT die Installation.
# Grund: Ein erneuter Start vom Medium darf keine zweite Loeschung ausloesen.
set default="0"
set timeout=30

menuentry "Try or Install Ubuntu" {
   linux /casper/vmlinuz file=/cdrom/preseed/mbp.seed boot=casper ro quiet splash pm_async=off intel_iommu=on iommu=pt ---
   initrd /casper/initrd
}
menuentry "Ubuntu (Safe Graphics)" {
   linux /casper/vmlinuz file=/cdrom/preseed/mbp164.seed boot=casper ro quiet splash nomodeset pm_async=off intel_iommu=on iommu=pt ---
   initrd /casper/initrd
}
menuentry "Ubuntu (NVMe blacklisted)" {
   linux /casper/vmlinuz file=/cdrom/preseed/mbp.seed boot=casper ro quiet splash pm_async=off intel_iommu=on iommu=pt modprobe.blacklist=nvme ---
   initrd /casper/initrd
}
menuentry "Check disc for defects" {
   linux /casper/vmlinuz boot=casper integrity-check enforcing=0 efi=noruntime pm_async=off ---
   initrd /casper/initrd
}

menuentry "--- MAXIMUS ---" {
   true
}

menuentry "Ubuntu mit T2-Unterstuetzung neu installieren" {
   linux /casper/vmlinuz file=/cdrom/preseed/maximus-de.seed boot=casper ro maximus.install=1 systemd.unit=multi-user.target pm_async=off intel_iommu=on iommu=pt pcie_ports=native ---
   initrd /casper/initrd
}

menuentry "Ubuntu mit T2-Unterstuetzung neu installieren (Safe Graphics)" {
   linux /casper/vmlinuz file=/cdrom/preseed/maximus-de.seed boot=casper ro maximus.install=1 systemd.unit=multi-user.target nomodeset pm_async=off intel_iommu=on iommu=pt ---
   initrd /casper/initrd
}

menuentry "MAXIMUS Selbsttest (nur Nachweis, keine Installation)" {
   linux /casper/vmlinuz file=/cdrom/preseed/maximus-selbsttest.seed boot=casper ro maximus.selftest=1 systemd.unit=multi-user.target console=tty0 console=ttyS0,115200 pm_async=off intel_iommu=on iommu=pt ---
   initrd /casper/initrd
}
