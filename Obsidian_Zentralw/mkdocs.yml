site_name: WIKI-Maximus_OS
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark Mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light Mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
plugins:
  - search
  - roamlinks
# Only the public wiki is published; everything else in this vault stays private.
docs_dir: 90_Wiki
